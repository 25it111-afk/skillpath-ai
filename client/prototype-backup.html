<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SkillPath AI</title>
<style>
:root{--bg:#08171f;--card:#10303c;--tx:#fff;--mut:#9db4bf;--acc:#2dd4bf;--gold:#f5b942;--line:#21505f;--grn:#4ade80}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.w{max-width:920px;margin:auto;padding:20px}h1{font:700 26px Georgia,serif;margin:0}h2{font-size:17px;margin:0 0 10px}
.s{color:var(--mut);font-size:13px}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
button{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
button.o{background:none;color:var(--acc);border:1px solid var(--acc)}.rb{text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);padding:16px}
input[type=text],input[type=email],input[type=password],select{padding:9px;border-radius:6px;background:var(--bg);color:var(--tx);border:1px solid var(--line);width:100%;box-sizing:border-box;margin:5px 0}
select{width:auto}label{display:block;margin:3px 0}.bar{height:10px;background:var(--line);border-radius:9px;position:relative;margin:6px 0 12px}.bar i{display:block;height:100%;border-radius:9px}
.mk{position:absolute;top:-3px;width:2px;height:16px;background:var(--gold)}.t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.big{font:700 40px Georgia,serif;color:var(--acc)}.wk{border-top:1px solid var(--line);padding:10px 0}.tag{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:9px;padding:1px 7px}
</style></head><body><div class="w"><div class="t"><div><h1>🧭 SkillPath AI</h1><div class="s">Your AI-powered personalized career roadmap</div></div><div id="top"></div></div><div id="app"></div></div>
<script>
const API='http://localhost:5000/api'; // after deploying the backend on Render, change to https://YOUR-APP.onrender.com/api
const RQ={'Software Engineer':{DSA:80,Programming:70,SQL:60,Git:60,'CS Fundamentals':70},'Data Analyst':{DSA:40,Programming:60,SQL:85,Git:40,'CS Fundamentals':50},'Web Developer':{DSA:50,Programming:80,SQL:50,Git:70,'CS Fundamentals':50}};
const Q=[['DSA','Time complexity of binary search on a sorted array?',['O(n)','O(log n)','O(n log n)','O(1)'],1],['DSA','Which structure follows LIFO order?',['Queue','Stack','Heap','Graph'],1],['Programming','Which concept lets a subclass redefine a parent method?',['Encapsulation','Overriding','Overloading','Abstraction'],1],['Programming','Which Java collection rejects duplicate elements?',['ArrayList','LinkedList','HashSet','Vector'],2],['SQL','Which clause filters groups after GROUP BY?',['WHERE','HAVING','ORDER BY','LIMIT'],1],['SQL','Which JOIN returns only matching rows from both tables?',['LEFT','RIGHT','INNER','FULL'],2],['Git','Which command creates and switches to a new branch?',['git branch -d x','git checkout -b x','git merge x','git clone x'],1],['Git','Which command uploads local commits to a remote?',['git pull','git fetch','git push','git add'],2],['CS Fundamentals','Which normal form removes partial dependencies?',['1NF','2NF','3NF','BCNF'],1],['CS Fundamentals','Which OSI layer handles IP routing?',['Transport','Network','Data Link','Session'],1]];
const K=Object.keys(RQ['Software Engineer']),R=Object.keys(RQ),A=document.getElementById('app');
let S={};try{S=JSON.parse(localStorage.getItem('sp')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('sp',JSON.stringify(S))}catch(e){}},v=i=>document.getElementById(i).value,esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(p,m='GET',b){const r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed ('+r.status+')');return d}
function logout(){S={};save();view()}function again(){S={token:S.token,name:S.name};save();view()}
function view(){document.getElementById('top').innerHTML=S.token?`<span class="s">👤 ${esc(S.name||'')}</span> <button class="o" onclick="again()">Restart</button> <button class="o" onclick="logout()">Logout</button>`:'';
!S.token?auth():!S.role?roles():!S.scores?quiz():S.data?dash():gen()}
function auth(){A.innerHTML=`<div class="c" style="max-width:380px"><h2>Login or create an account</h2><input type="text" id="n" placeholder="Name (for register)"><input type="email" id="e" placeholder="Email"><input type="password" id="p" placeholder="Password"><div id="m" class="s" style="color:#f87171"></div><button onclick="go(0)">Login</button> <button class="o" onclick="go(1)">Register</button></div>`}
async function go(reg){try{const d=await api('/auth/'+(reg?'register':'login'),'POST',{name:v('n'),email:v('e'),password:v('p')});if(!d.token)throw new Error('Server did not return a token');const u=d.user||{};S={token:d.token,name:u.name||u.email||v('n')||v('e')};save();view()}catch(e){document.getElementById('m').textContent=e.message==='Failed to fetch'?'Cannot reach the server. Is the backend running?':e.message}}
function roles(){A.innerHTML=`<div class="c"><h2>1. Choose your target career</h2><div class="g">${R.map((r,i)=>`<button class="rb" onclick="pick(${i})"><b>${r}</b><div class="s">${K.map(k=>k+' '+RQ[r][k]+'%').join(' · ')}</div></button>`).join('')}</div></div>`}
function pick(i){S.role=R[i];save();view()}
function quiz(){A.innerHTML=`<div class="c"><h2>2. AI skill assessment — ${S.role}</h2><div class="s">Answer the questions and rate your confidence per skill.</div></div>`+K.map((k,x)=>`<div class="c"><h2>${k}</h2>${Q.map((q,i)=>q[0]!=k?'':`<p><b>${q[1]}</b></p>`+q[2].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')).join('')}<p class="s">Self-rating: <input type="range" id="r${x}" min="0" max="100" value="50"></p></div>`).join('')+`<button onclick="grade()">Analyze my skills</button>`}
function grade(){S.scores={};K.forEach((k,x)=>{let c=0;Q.forEach((q,i)=>{if(q[0]==k){const a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value==q[3])c++}});S.scores[k]=Math.round(.6*(c/2*100)+.4*+v('r'+x))});save();gen()}
async function gen(){A.innerHTML='<div class="c">✨ Generating your personalized roadmap…</div>';try{S.data=await api('/roadmap/generate','POST',{targetRole:S.role,scores:S.scores});save();dash()}catch(e){A.innerHTML=`<div class="c">⚠ ${esc(e.message)}<br><br><button onclick="again()">Start over</button></div>`}}
async function practice(i){const it=S.data.roadmap[i],n=+v('p'+i);try{const r=await api('/roadmap/practice','POST',{skill:it.skill,topic:it.topic,solved:n});S.scores=r.scores;S.log=r.status=='completed'?`✅ ${it.topic}: ${n}/5 solved. ${it.skill} is now ${r.scores[it.skill]}%. Roadmap moves ahead.`:`⚠ Struggled with ${it.topic} (${n}/5). Weakness detected: ${it.skill} dropped to ${r.scores[it.skill]}% and the topic is kept for revision.`;save();gen()}catch(e){alert(e.message)}}
function dash(){const d=S.data,rq=RQ[S.role],sc=S.scores,rd=Math.round(K.reduce((a,k)=>a+Math.min((sc[k]??0)/rq[k],1),0)/K.length*100),gaps=d.gaps.map(g=>g.skill),st=K.filter(k=>sc[k]>=rq[k]);
A.innerHTML=`<div class="g"><div class="c"><div class="s">Career readiness — ${S.role}</div><div class="big">${rd}%</div><div class="bar"><i style="width:${rd}%;background:var(--acc)"></i></div></div><div class="c"><h2>AI analysis</h2><div><b style="color:var(--grn)">Strengths:</b> ${st.join(', ')||'none yet'}</div><div><b style="color:var(--gold)">Priority gaps:</b> ${gaps.join(', ')||'none, you are role-ready!'}</div></div></div>
<div class="c"><h2>Skill-gap analysis <span class="s">(gold marker = required level)</span></h2>${K.map(k=>`<div class="t"><span>${k}</span><span class="s">${sc[k]}% / ${rq[k]}%</span></div><div class="bar"><i style="width:${sc[k]}%;background:${sc[k]>=rq[k]?'var(--grn)':'var(--gold)'}"></i><span class="mk" style="left:${rq[k]}%"></span></div>`).join('')}</div>
${S.log?`<div class="c"><h2>Adaptive engine</h2><div class="s">${esc(S.log)}</div></div>`:''}
<div class="c"><h2>Your personalized roadmap</h2><div class="s">Generated by: ${d.source=='gemini'?'Gemini AI ✨':'rule-based fallback'}${d.geminiError?' — Gemini error: '+esc(d.geminiError):''}</div>${d.roadmap.length?d.roadmap.map((x,i)=>`<div class="wk"><div class="t"><div><b>Week ${x.week||i+1}: ${esc(x.topic)}</b> <span class="tag">${esc(x.skill)}</span><div class="s">${(x.practice||[]).map(esc).join(' • ')}${x.project?' | Project: '+esc(x.project):''}</div></div><div>Solved <select id="p${i}">${[0,1,2,3,4,5].map(n=>`<option${n==4?' selected':''}>${n}</option>`).join('')}</select>/5 <button onclick="practice(${i})">Submit</button></div></div></div>`).join(''):'<p>🎉 You meet every requirement for this role.</p>'}</div>`}
view();
</script></body></html>
